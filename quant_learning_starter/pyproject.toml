[project]
name = "quant-learning-starter"
version = "0.1.0"
description = "Synthetic daily equity factor tutorial, P0 and P1 only"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.2,<2.3",
    "pandas>=2.3,<3",
    "scipy>=1.15,<1.16",
    "matplotlib>=3.10,<3.11",
    "pyarrow>=23,<24",
    "ipykernel>=7.2,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<0.11",
    "pytest>=8.4,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
